[project]
name = "bayanbench"
version = "2.0.0.dev0"
description = "BayanBench: evaluation suite for dyslexia-friendly Arabic rewriting"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["huggingface_hub>=0.24"]

[project.optional-dependencies]
# reading level (CAMeL BAREC readability model)
ease = ["torch>=2.1", "transformers>=4.46"]
# run a Hugging Face seq2seq model the way the app runs it (transformers 5 unties AraT5's weights and drops
# AraBART's <s></s>, so outputs come out wrong: keep it in its own environment if [meaning] needs 5)
predict = ["torch>=2.1", "transformers>=4.46,<5", "sentencepiece", "protobuf"]
# score meaning with the open scorer (Gemma 4 31B int4 on vLLM; a 44 GB+ GPU)
meaning = ["vllm>=0.11"]
# v1: judge with an API (Gemini) or any OpenAI-compatible server
judge = ["google-genai>=1.30", "openai>=1.40"]
all = ["bayanbench[ease,predict,meaning,judge]"]
dev = ["pytest"]

[project.scripts]
bayanbench = "bayanbench.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
