<!doctype html><html lang="ar" dir="ltr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:24px;box-sizing:border-box;background:var(--surface-page)}.sw{display:grid;gap:8px}.chip{height:64px;border-radius:var(--radius-sm);border:1px solid rgba(40,40,36,.08)}.lbl{font:var(--type-caption);color:var(--text-muted)}.lbl b{display:block;font-weight:500;color:var(--text-primary)}.mono{font-family:var(--font-mono);font-size:11px}</style></head>
<body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px"><div style="display:grid;gap:6px"><div style="height:120px;background:var(--paper-2);border-radius:var(--radius-sm);display:grid;place-items:center;overflow:hidden;position:relative"><img src="../assets/logo/bayan-stacked-light.svg" style="height:84px;filter:hue-rotate(160deg)"><div style="position:absolute;inset:0;background:linear-gradient(to top right,transparent 49%,var(--brick-600) 49.5%,var(--brick-600) 50.5%,transparent 51%)"></div></div><span class="lbl">Recolor dot</span></div><div style="display:grid;gap:6px"><div style="height:120px;background:var(--paper-2);border-radius:var(--radius-sm);display:grid;place-items:center;overflow:hidden;position:relative"><img src="../assets/logo/bayan-stacked-light.svg" style="height:84px;transform:scaleX(1.4)"><div style="position:absolute;inset:0;background:linear-gradient(to top right,transparent 49%,var(--brick-600) 49.5%,var(--brick-600) 50.5%,transparent 51%)"></div></div><span class="lbl">Stretch</span></div><div style="display:grid;gap:6px"><div style="height:120px;background:var(--paper-2);border-radius:var(--radius-sm);display:grid;place-items:center;overflow:hidden;position:relative"><img src="../assets/logo/bayan-stacked-light.svg" style="height:84px;transform:rotate(-12deg)"><div style="position:absolute;inset:0;background:linear-gradient(to top right,transparent 49%,var(--brick-600) 49.5%,var(--brick-600) 50.5%,transparent 51%)"></div></div><span class="lbl">Rotate</span></div><div style="display:grid;gap:6px"><div style="height:120px;background:var(--paper-2);border-radius:var(--radius-sm);display:grid;place-items:center;overflow:hidden;position:relative"><img src="../assets/logo/bayan-stacked-light.svg" style="height:84px;opacity:.35"><div style="position:absolute;inset:0;background:linear-gradient(to top right,transparent 49%,var(--brick-600) 49.5%,var(--brick-600) 50.5%,transparent 51%)"></div></div><span class="lbl">Fade</span></div></div></body></html>
