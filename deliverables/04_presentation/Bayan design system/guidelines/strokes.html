<!doctype html><html lang="ar" dir="ltr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:24px;box-sizing:border-box;background:var(--surface-page)}.sw{display:grid;gap:8px}.chip{height:64px;border-radius:var(--radius-sm);border:1px solid rgba(40,40,36,.08)}.lbl{font:var(--type-caption);color:var(--text-muted)}.lbl b{display:block;font-weight:500;color:var(--text-primary)}.mono{font-family:var(--font-mono);font-size:11px}</style></head>
<body><div style="display:grid;gap:18px"><div style="display:flex;align-items:center;gap:16px"><div style="flex:1;border-top:var(--stroke-hair) solid var(--ink-1)"></div><span class="lbl" style="width:180px">1px · dividers</span></div><div style="display:flex;align-items:center;gap:16px"><div style="flex:1;border-top:var(--stroke-pen) solid var(--ink-1)"></div><span class="lbl" style="width:180px">1.5px · outlined controls</span></div><div style="display:flex;align-items:center;gap:16px"><div style="flex:1;border-top:var(--stroke-bold) solid var(--ink-1)"></div><span class="lbl" style="width:180px">2px · emphasis, active tab</span></div></div></body></html>
