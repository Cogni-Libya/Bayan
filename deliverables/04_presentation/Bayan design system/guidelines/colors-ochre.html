<!-- @dsCard group="Colors" viewport="700x170" name="Ochre accent" subtitle="The sun dot. Use sparingly — one ochre moment per view" -->
<!doctype html><html lang="ar" dir="ltr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:24px;box-sizing:border-box;background:var(--surface-page)}.sw{display:grid;gap:8px}.chip{height:64px;border-radius:var(--radius-sm);border:1px solid rgba(40,40,36,.08)}.lbl{font:var(--type-caption);color:var(--text-muted)}.lbl b{display:block;font-weight:500;color:var(--text-primary)}.mono{font-family:var(--font-mono);font-size:11px}</style></head>
<body><div style="display:grid;grid-template-columns:repeat(6,1fr);gap:12px"><div class="sw"><div class="chip" style="background:var(--ochre-50)"></div><div class="lbl"><b>50</b><span class="mono">--ochre-50<br>#F6EDE1</span></div></div><div class="sw"><div class="chip" style="background:var(--ochre-100)"></div><div class="lbl"><b>100</b><span class="mono">--ochre-100<br>#EEDDC7</span></div></div><div class="sw"><div class="chip" style="background:var(--ochre-300)"></div><div class="lbl"><b>300</b><span class="mono">--ochre-300<br>#DDBB95</span></div></div><div class="sw"><div class="chip" style="background:var(--ochre-500)"></div><div class="lbl"><b>500 · brand</b><span class="mono">--ochre-500<br>#C6986B</span></div></div><div class="sw"><div class="chip" style="background:var(--ochre-600)"></div><div class="lbl"><b>600</b><span class="mono">--ochre-600<br>#A87A4D</span></div></div><div class="sw"><div class="chip" style="background:var(--ochre-700)"></div><div class="lbl"><b>700 · text</b><span class="mono">--ochre-700<br>#8A5E35</span></div></div></div></body></html>
