<!-- @dsCard group="Dark mode" viewport="700x170" name="Dark grounds" subtitle="Night scale (paper tokens in dark theme)" -->
<!doctype html><html lang="ar" dir="ltr" data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:24px;box-sizing:border-box;background:var(--surface-page)}.chip{height:64px;border-radius:var(--radius-sm);border:1px solid rgba(128,128,120,.15)}.lbl{font:var(--type-caption);color:var(--text-muted)}.lbl b{display:block;font-weight:500;color:var(--text-primary)}.mono{font-family:var(--font-mono);font-size:11px}</style></head>
<body><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:12px"><div style="display:grid;gap:8px"><div class="chip" style="background:var(--paper-2)"></div><div class="lbl"><b>Hover / sunken</b><span class="mono">--paper-2<br>#26261E</span></div></div><div style="display:grid;gap:8px"><div class="chip" style="background:var(--paper-0)"></div><div class="lbl"><b>Raised</b><span class="mono">--paper-0<br>#212119</span></div></div><div style="display:grid;gap:8px"><div class="chip" style="background:var(--paper-1)"></div><div class="lbl"><b>Page · night</b><span class="mono">--paper-1<br>#1A1A14</span></div></div><div style="display:grid;gap:8px"><div class="chip" style="background:var(--paper-3)"></div><div class="lbl"><b>Subtle line</b><span class="mono">--paper-3<br>#302F27</span></div></div><div style="display:grid;gap:8px"><div class="chip" style="background:var(--paper-4)"></div><div class="lbl"><b>Border</b><span class="mono">--paper-4<br>#3D3C33</span></div></div></div></body></html>
