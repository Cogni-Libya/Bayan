<!-- @dsCard group="Dark mode" viewport="700x520" name="Components in dark" subtitle="Same components under data-theme=dark" -->
<!doctype html><html lang="ar" dir="rtl" data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<script src="https://unpkg.com/react@18/umd/react.development.js"></script><script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script><script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="../_ds_bundle.js"></script></head>
<body style="padding:24px;box-sizing:border-box"><div id="root"></div>
<script type="text/babel">
const NS=Object.values(window).find(v=>v&&typeof v==='object'&&v.Button&&v.Card)||{};
const {Button,IconButton,Badge,Tag,Card,Input,Select,Checkbox,Radio,Switch,Tabs,Dialog,Toast,Tooltip}=NS;
const Row=({children,gap=12})=><div style={{display:'flex',flexWrap:'wrap',alignItems:'center',gap}}>{children}</div>;
const I=({n})=><i data-lucide={n} style={{width:18,height:18,strokeWidth:1.75}}></i>;
function App(){React.useEffect(()=>{window.lucide&&lucide.createIcons({attrs:{'stroke-width':1.75,width:18,height:18}});});return <div style={{display:'grid',gap:22}}>
<Row><Button>ابدأ القراءة</Button><Button variant="accent">اشترك الآن</Button><Button variant="secondary">حفظ للاحقاً</Button><Button variant="ghost">تخطي</Button><Button variant="danger">حذف</Button></Row>
<Row><Button size="sm">صغير</Button><Button size="md">متوسط</Button><Button size="lg" iconStart={<I n="book-open"/>}>كبير مع أيقونة</Button><Button disabled>معطل</Button></Row>
<Row><IconButton label="حفظ"><I n="bookmark"/></IconButton><IconButton label="مشاركة" variant="secondary"><I n="share-2"/></IconButton><IconButton label="بحث" variant="primary"><I n="search"/></IconButton><Tooltip content="إضافة ملاحظة" open><IconButton label="ملاحظة" variant="secondary"><I n="pen-line"/></IconButton></Tooltip></Row>
<Row gap={8}><Badge>مسودة</Badge><Badge tone="accent" dot>جديد</Badge><Badge tone="success">مكتمل</Badge><Badge tone="danger">متأخر</Badge><Badge tone="info">صوتي</Badge><Badge tone="ink">٣</Badge></Row>
<Row gap={8}><Tag selected>شعر</Tag><Tag onClick={()=>{}}>رواية</Tag><Tag onClick={()=>{}}>فلسفة</Tag><Tag onRemove={()=>{}}>تاريخ</Tag></Row>
<div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:12}}>
<Card interactive><div style={{font:'var(--type-h4)'}}>طوق الحمامة</div><div style={{font:'var(--type-caption)',color:'var(--text-muted)',marginTop:4}}>ابن حزم · ٦٢٪</div></Card>
<Card variant="sunken"><div style={{font:'var(--type-label)'}}>ملاحظاتك</div><div style={{font:'var(--type-caption)',color:'var(--text-muted)',marginTop:4}}>١٢ اقتباساً محفوظاً</div></Card>
<Card variant="inverse"><div style={{font:'var(--type-label)'}}>اقتباس اليوم</div><div style={{font:'var(--type-caption)',opacity:.75,marginTop:4}}>«الكتاب نعم الجليس»</div></Card></div>
</div>;}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
