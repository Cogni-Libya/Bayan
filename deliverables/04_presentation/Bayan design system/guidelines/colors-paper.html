<!-- @dsCard group="Colors" viewport="700x170" name="Paper" subtitle="Warm neutral grounds — paper-1 is the logo ground" -->
<!doctype html><html lang="ar" dir="ltr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:24px;box-sizing:border-box;background:var(--surface-page)}.sw{display:grid;gap:8px}.chip{height:64px;border-radius:var(--radius-sm);border:1px solid rgba(40,40,36,.08)}.lbl{font:var(--type-caption);color:var(--text-muted)}.lbl b{display:block;font-weight:500;color:var(--text-primary)}.mono{font-family:var(--font-mono);font-size:11px}</style></head>
<body><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:12px"><div class="sw"><div class="chip" style="background:var(--paper-0)"></div><div class="lbl"><b>Paper 0</b><span class="mono">--paper-0<br>#FBF8F0</span></div></div><div class="sw"><div class="chip" style="background:var(--paper-1)"></div><div class="lbl"><b>Paper 1 · page</b><span class="mono">--paper-1<br>#F6F2E6</span></div></div><div class="sw"><div class="chip" style="background:var(--paper-2)"></div><div class="lbl"><b>Paper 2</b><span class="mono">--paper-2<br>#EFE9D9</span></div></div><div class="sw"><div class="chip" style="background:var(--paper-3)"></div><div class="lbl"><b>Paper 3</b><span class="mono">--paper-3<br>#E6DFCC</span></div></div><div class="sw"><div class="chip" style="background:var(--paper-4)"></div><div class="lbl"><b>Paper 4</b><span class="mono">--paper-4<br>#DCD4BF</span></div></div></div></body></html>
