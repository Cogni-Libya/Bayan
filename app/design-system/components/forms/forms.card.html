<!-- @dsCard group="Components" viewport="700x400" name="Forms" -->
<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.development.js"></script><script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script><script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script></head>
<body style="padding:24px;box-sizing:border-box"><div id="root"></div>
<script type="text/babel">
const NS=Object.values(window).find(v=>v&&typeof v==='object'&&v.Button&&v.Card)||{};
const {Button,IconButton,Badge,Tag,Card,Input,Select,Checkbox,Radio,Switch,Tabs,Dialog,Toast,Tooltip}=NS;
const Row=({children,gap=12})=><div style={{display:'flex',flexWrap:'wrap',alignItems:'center',gap}}>{children}</div>;
const I=({n})=><i data-lucide={n} style={{width:18,height:18,strokeWidth:1.75}}></i>;
function App(){React.useEffect(()=>{window.lucide&&lucide.createIcons({attrs:{'stroke-width':1.75,width:18,height:18}});});return <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'20px 28px'}}>
<Input label="الاسم" placeholder="اكتب اسمك" hint="كما سيظهر في ملفك"/>
<Input label="البريد الإلكتروني" defaultValue="name@" error="صيغة البريد غير صحيحة"/>
<Select label="لغة القراءة" options={['العربية','English','Français']}/>
<Input label="معطل" placeholder="غير متاح" disabled/>
<div style={{display:'grid',gap:12}}><Checkbox label="أرسل لي ملخصاً أسبوعياً" defaultChecked/><Checkbox label="أوافق على الشروط"/></div>
<div style={{display:'grid',gap:12}}><Switch label="الوضع الليلي" defaultChecked/><Switch label="الإشعارات"/></div>
<div style={{gridColumn:'1 / -1'}}><Radio options={['ورقي','إلكتروني','صوتي']} direction="row"/></div>
</div>;}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
