<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:24px;box-sizing:border-box;background:var(--surface-page)}.lbl{font:500 13px/1.3 var(--font-ui);color:var(--text-muted)}.w{word-spacing:var(--read-word-space)}</style></head><body><div style="display:grid;gap:10px"><div style="display:flex;align-items:baseline;justify-content:space-between;gap:16px;border-bottom:1px solid var(--border-subtle);padding-bottom:6px"><span class="w" style="font:400 var(--read-s)/1.6 var(--font-reading)">القراءة متعة</span><span class="lbl" dir="ltr">S · 20</span></div><div style="display:flex;align-items:baseline;justify-content:space-between;gap:16px;border-bottom:1px solid var(--border-subtle);padding-bottom:6px"><span class="w" style="font:400 var(--read-m)/1.6 var(--font-reading)">القراءة متعة</span><span class="lbl" dir="ltr">M · 24 (default)</span></div><div style="display:flex;align-items:baseline;justify-content:space-between;gap:16px;border-bottom:1px solid var(--border-subtle);padding-bottom:6px"><span class="w" style="font:400 var(--read-l)/1.6 var(--font-reading)">القراءة متعة</span><span class="lbl" dir="ltr">L · 28</span></div><div style="display:flex;align-items:baseline;justify-content:space-between;gap:16px;border-bottom:1px solid var(--border-subtle);padding-bottom:6px"><span class="w" style="font:400 var(--read-xl)/1.6 var(--font-reading)">القراءة متعة</span><span class="lbl" dir="ltr">XL · 34</span></div></div></body></html>
