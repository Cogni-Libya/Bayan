<!doctype html><html lang="ar" dir="ltr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:24px;box-sizing:border-box;background:var(--surface-page)}.sw{display:grid;gap:8px}.chip{height:64px;border-radius:var(--radius-sm);border:1px solid rgba(40,40,36,.08)}.lbl{font:var(--type-caption);color:var(--text-muted)}.lbl b{display:block;font-weight:500;color:var(--text-primary)}.mono{font-family:var(--font-mono);font-size:11px}</style></head>
<body><div style="display:flex;gap:24px;padding:8px"><div style="flex:1;height:90px;background:var(--surface-raised);border-radius:var(--radius-md);box-shadow:var(--shadow-1);display:grid;place-items:center"><span class="mono">--shadow-1</span></div><div style="flex:1;height:90px;background:var(--surface-raised);border-radius:var(--radius-md);box-shadow:var(--shadow-2);display:grid;place-items:center"><span class="mono">--shadow-2</span></div><div style="flex:1;height:90px;background:var(--surface-raised);border-radius:var(--radius-md);box-shadow:var(--shadow-3);display:grid;place-items:center"><span class="mono">--shadow-3</span></div><div style="flex:1;height:90px;background:var(--surface-raised);border-radius:var(--radius-md);box-shadow:var(--ring);display:grid;place-items:center"><span class="mono">--ring</span></div></div></body></html>
