<!-- @dsCard group="Dark mode" viewport="700x170" name="Dark semantic" subtitle="Lifted status colors for night grounds" -->
<!doctype html><html lang="ar" dir="ltr" data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:24px;box-sizing:border-box;background:var(--surface-page)}.chip{height:64px;border-radius:var(--radius-sm);border:1px solid rgba(128,128,120,.15)}.lbl{font:var(--type-caption);color:var(--text-muted)}.lbl b{display:block;font-weight:500;color:var(--text-primary)}.mono{font-family:var(--font-mono);font-size:11px}</style></head>
<body><div style="display:grid;grid-template-columns:repeat(6,1fr);gap:12px"><div style="display:grid;gap:8px"><div class="chip" style="background:var(--success)"></div><div class="lbl"><b>Success</b><span class="mono">--success<br>#9DB585</span></div></div><div style="display:grid;gap:8px"><div class="chip" style="background:var(--success-soft)"></div><div class="lbl"><b>Soft</b><span class="mono">--success-soft<br>#232A1C</span></div></div><div style="display:grid;gap:8px"><div class="chip" style="background:var(--danger)"></div><div class="lbl"><b>Danger</b><span class="mono">--danger<br>#D98A7E</span></div></div><div style="display:grid;gap:8px"><div class="chip" style="background:var(--danger-soft)"></div><div class="lbl"><b>Soft</b><span class="mono">--danger-soft<br>#33201B</span></div></div><div style="display:grid;gap:8px"><div class="chip" style="background:var(--info)"></div><div class="lbl"><b>Info</b><span class="mono">--info<br>#93AEBB</span></div></div><div style="display:grid;gap:8px"><div class="chip" style="background:var(--info-soft)"></div><div class="lbl"><b>Soft</b><span class="mono">--info-soft<br>#1C2529</span></div></div></div></body></html>
