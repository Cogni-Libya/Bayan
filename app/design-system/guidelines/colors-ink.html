<!doctype html><html lang="ar" dir="ltr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:24px;box-sizing:border-box;background:var(--surface-page)}.sw{display:grid;gap:8px}.chip{height:64px;border-radius:var(--radius-sm);border:1px solid rgba(40,40,36,.08)}.lbl{font:var(--type-caption);color:var(--text-muted)}.lbl b{display:block;font-weight:500;color:var(--text-primary)}.mono{font-family:var(--font-mono);font-size:11px}</style></head>
<body><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px"><div class="sw"><div class="chip" style="background:var(--ink-1)"></div><div class="lbl"><b>Ink 1 · primary</b><span class="mono">--ink-1<br>#282824</span></div></div><div class="sw"><div class="chip" style="background:var(--ink-2)"></div><div class="lbl"><b>Ink 2</b><span class="mono">--ink-2<br>#4A4842</span></div></div><div class="sw"><div class="chip" style="background:var(--ink-3)"></div><div class="lbl"><b>Ink 3 · muted</b><span class="mono">--ink-3<br>#6F6B5E</span></div></div><div class="sw"><div class="chip" style="background:var(--ink-4)"></div><div class="lbl"><b>Ink 4 · disabled</b><span class="mono">--ink-4<br>#A29D8C</span></div></div></div></body></html>
