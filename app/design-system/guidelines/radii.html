<!doctype html><html lang="ar" dir="ltr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:24px;box-sizing:border-box;background:var(--surface-page)}.sw{display:grid;gap:8px}.chip{height:64px;border-radius:var(--radius-sm);border:1px solid rgba(40,40,36,.08)}.lbl{font:var(--type-caption);color:var(--text-muted)}.lbl b{display:block;font-weight:500;color:var(--text-primary)}.mono{font-family:var(--font-mono);font-size:11px}</style></head>
<body><div style="display:flex;gap:18px"><div style="display:grid;gap:6px;justify-items:center"><div style="width:72px;height:56px;background:var(--paper-0);border:1.5px solid var(--ink-1);border-radius:var(--radius-xs)"></div><span class="mono" style="color:var(--ink-3)">xs</span></div><div style="display:grid;gap:6px;justify-items:center"><div style="width:72px;height:56px;background:var(--paper-0);border:1.5px solid var(--ink-1);border-radius:var(--radius-sm)"></div><span class="mono" style="color:var(--ink-3)">sm</span></div><div style="display:grid;gap:6px;justify-items:center"><div style="width:72px;height:56px;background:var(--paper-0);border:1.5px solid var(--ink-1);border-radius:var(--radius-md)"></div><span class="mono" style="color:var(--ink-3)">md</span></div><div style="display:grid;gap:6px;justify-items:center"><div style="width:72px;height:56px;background:var(--paper-0);border:1.5px solid var(--ink-1);border-radius:var(--radius-lg)"></div><span class="mono" style="color:var(--ink-3)">lg</span></div><div style="display:grid;gap:6px;justify-items:center"><div style="width:72px;height:56px;background:var(--paper-0);border:1.5px solid var(--ink-1);border-radius:var(--radius-xl)"></div><span class="mono" style="color:var(--ink-3)">xl</span></div><div style="display:grid;gap:6px;justify-items:center"><div style="width:72px;height:56px;background:var(--paper-0);border:1.5px solid var(--ink-1);border-radius:var(--radius-pill)"></div><span class="mono" style="color:var(--ink-3)">pill</span></div></div></body></html>
