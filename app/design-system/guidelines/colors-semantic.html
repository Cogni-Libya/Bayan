<!-- @dsCard group="Colors" viewport="700x170" name="Semantic" subtitle="Muted, earthy status colors with soft tints" -->
<!doctype html><html lang="ar" dir="ltr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:24px;box-sizing:border-box;background:var(--surface-page)}.sw{display:grid;gap:8px}.chip{height:64px;border-radius:var(--radius-sm);border:1px solid rgba(40,40,36,.08)}.lbl{font:var(--type-caption);color:var(--text-muted)}.lbl b{display:block;font-weight:500;color:var(--text-primary)}.mono{font-family:var(--font-mono);font-size:11px}</style></head>
<body><div style="display:grid;grid-template-columns:repeat(6,1fr);gap:12px"><div class="sw"><div class="chip" style="background:var(--success)"></div><div class="lbl"><b>Success · olive</b><span class="mono">--success<br>#5B7447</span></div></div><div class="sw"><div class="chip" style="background:var(--success-soft)"></div><div class="lbl"><b>Success soft</b><span class="mono">--success-soft<br>#E9EDDC</span></div></div><div class="sw"><div class="chip" style="background:var(--danger)"></div><div class="lbl"><b>Danger · brick</b><span class="mono">--danger<br>#A2463A</span></div></div><div class="sw"><div class="chip" style="background:var(--danger-soft)"></div><div class="lbl"><b>Danger soft</b><span class="mono">--danger-soft<br>#F4E1DA</span></div></div><div class="sw"><div class="chip" style="background:var(--info)"></div><div class="lbl"><b>Info · slate</b><span class="mono">--info<br>#4C6573</span></div></div><div class="sw"><div class="chip" style="background:var(--info-soft)"></div><div class="lbl"><b>Info soft</b><span class="mono">--info-soft<br>#E1E7E6</span></div></div></div></body></html>
