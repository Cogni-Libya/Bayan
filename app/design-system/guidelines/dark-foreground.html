<!-- @dsCard group="Dark mode" viewport="700x170" name="Dark foreground" subtitle="Cream scale (ink tokens in dark theme) + ochre" -->
<!doctype html><html lang="ar" dir="ltr" data-theme="dark"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:24px;box-sizing:border-box;background:var(--surface-page)}.chip{height:64px;border-radius:var(--radius-sm);border:1px solid rgba(128,128,120,.15)}.lbl{font:var(--type-caption);color:var(--text-muted)}.lbl b{display:block;font-weight:500;color:var(--text-primary)}.mono{font-family:var(--font-mono);font-size:11px}</style></head>
<body><div style="display:grid;grid-template-columns:repeat(6,1fr);gap:12px"><div style="display:grid;gap:8px"><div class="chip" style="background:var(--ink-1)"></div><div class="lbl"><b>Cream · primary</b><span class="mono">--ink-1<br>#F2EFE2</span></div></div><div style="display:grid;gap:8px"><div class="chip" style="background:var(--ink-2)"></div><div class="lbl"><b>Secondary</b><span class="mono">--ink-2<br>#D2CEBF</span></div></div><div style="display:grid;gap:8px"><div class="chip" style="background:var(--ink-3)"></div><div class="lbl"><b>Muted</b><span class="mono">--ink-3<br>#A19D8E</span></div></div><div style="display:grid;gap:8px"><div class="chip" style="background:var(--ink-4)"></div><div class="lbl"><b>Disabled</b><span class="mono">--ink-4<br>#6C695E</span></div></div><div style="display:grid;gap:8px"><div class="chip" style="background:var(--ochre-500)"></div><div class="lbl"><b>Sun</b><span class="mono">--ochre-500<br>#C6986B</span></div></div><div style="display:grid;gap:8px"><div class="chip" style="background:var(--ochre-700)"></div><div class="lbl"><b>Accent text</b><span class="mono">--ochre-700<br>#DDBB95</span></div></div></div></body></html>
