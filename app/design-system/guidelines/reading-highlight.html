<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:24px;box-sizing:border-box;background:var(--surface-page)}.lbl{font:500 13px/1.3 var(--font-ui);color:var(--text-muted)}.w{word-spacing:var(--read-word-space)}</style></head><body><p class="w" style="margin:0;font:var(--type-reading);max-width:var(--read-measure)"><span style="color:var(--read-spoken)">جلسَ قربَ</span> <span style="background:var(--read-highlight);color:var(--read-highlight-ink);border-radius:6px;padding:0 6px;box-decoration-break:clone">النافذةِ</span> وبدأَ يقرأُ بهدوء.</p><div class="lbl" style="margin-top:14px" dir="ltr">--read-highlight · --read-spoken · pill radius 6px, no underline, no bold shift</div></body></html>
