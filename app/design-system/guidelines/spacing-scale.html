<!-- @dsCard group="Spacing" viewport="700x200" name="Spacing scale" subtitle="4px base, --space-1 … --space-10" -->
<!doctype html><html lang="ar" dir="ltr"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:24px;box-sizing:border-box;background:var(--surface-page)}.sw{display:grid;gap:8px}.chip{height:64px;border-radius:var(--radius-sm);border:1px solid rgba(40,40,36,.08)}.lbl{font:var(--type-caption);color:var(--text-muted)}.lbl b{display:block;font-weight:500;color:var(--text-primary)}.mono{font-family:var(--font-mono);font-size:11px}</style></head>
<body><div style="display:flex;align-items:flex-end;gap:14px"><div style="display:grid;gap:6px;justify-items:center"><div style="width:var(--space-1);height:var(--space-1);background:var(--ink-1);border-radius:2px"></div><span class="mono" style="color:var(--ink-3)">1</span></div><div style="display:grid;gap:6px;justify-items:center"><div style="width:var(--space-2);height:var(--space-2);background:var(--ink-1);border-radius:2px"></div><span class="mono" style="color:var(--ink-3)">2</span></div><div style="display:grid;gap:6px;justify-items:center"><div style="width:var(--space-3);height:var(--space-3);background:var(--ink-1);border-radius:2px"></div><span class="mono" style="color:var(--ink-3)">3</span></div><div style="display:grid;gap:6px;justify-items:center"><div style="width:var(--space-4);height:var(--space-4);background:var(--ink-1);border-radius:2px"></div><span class="mono" style="color:var(--ink-3)">4</span></div><div style="display:grid;gap:6px;justify-items:center"><div style="width:var(--space-5);height:var(--space-5);background:var(--ink-1);border-radius:2px"></div><span class="mono" style="color:var(--ink-3)">5</span></div><div style="display:grid;gap:6px;justify-items:center"><div style="width:var(--space-6);height:var(--space-6);background:var(--ink-1);border-radius:2px"></div><span class="mono" style="color:var(--ink-3)">6</span></div><div style="display:grid;gap:6px;justify-items:center"><div style="width:var(--space-7);height:var(--space-7);background:var(--ink-1);border-radius:2px"></div><span class="mono" style="color:var(--ink-3)">7</span></div><div style="display:grid;gap:6px;justify-items:center"><div style="width:var(--space-8);height:var(--space-8);background:var(--ink-1);border-radius:2px"></div><span class="mono" style="color:var(--ink-3)">8</span></div><div style="display:grid;gap:6px;justify-items:center"><div style="width:var(--space-9);height:var(--space-9);background:var(--ink-1);border-radius:2px"></div><span class="mono" style="color:var(--ink-3)">9</span></div></div><div class="lbl" style="margin-top:12px">4 · 8 · 12 · 16 · 24 · 32 · 48 · 64 · 96</div></body></html>
